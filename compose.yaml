name: sat-sa

x-hardened: &hardened
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

services:
  syft:
    <<: *hardened
    profiles: [assurance]
    build:
      context: .
      dockerfile: security-assurance/syft/Dockerfile
      args:
        SYFT_VERSION: ${SYFT_VERSION:-latest}
    image: sat-sa/syft:${SYFT_VERSION:-latest}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    environment:
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    command:
      - dir:/src
      - -o
      - cyclonedx-json
      - -q
    volumes:
      - ./requirements.txt:/src/requirements.txt:ro
      - ./analytics:/src/analytics:ro
      - ./backend:/src/backend:ro
      - ./dashboard:/src/dashboard:ro
      - ./data/asset_inventory.csv:/src/data/asset_inventory.csv:ro
      - ./data/sample_alerts.csv:/src/data/sample_alerts.csv:ro
      - ./data/supervisory_findings.json:/src/data/supervisory_findings.json:ro
      - ./security-assurance:/src/security-assurance:ro
      - ./soc-evidence:/src/soc-evidence:ro
      - ./tests:/src/tests:ro
    networks: [scan_internal]

  grype:
    <<: *hardened
    profiles: [assurance]
    build:
      context: .
      dockerfile: security-assurance/grype/Dockerfile
      args:
        GRYPE_VERSION: ${GRYPE_VERSION:-latest}
    image: sat-sa/grype:${GRYPE_VERSION:-latest}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1g
    command:
      - sbom:/sbom/sat_sa_sbom.json
      - -o
      - json=/reports/grype_report.json
    environment:
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      GRYPE_DB_CACHE_DIR: /var/cache/grype
    volumes:
      - ./data/sbom:/sbom:ro
      - ./data/vulnerabilities:/reports:rw
      - grype_db_cache:/var/cache/grype
    networks: [scan_internal, scanner_egress]

  dependency-track-db:
    <<: *hardened
    profiles: [dependency-track]
    build:
      context: .
      dockerfile: security-assurance/dependency-track/postgres/Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-17-alpine}
    image: sat-sa/dependency-track-db:${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,size=16m
    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DTRACK_DB_PASSWORD:?Set DTRACK_DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - dtrack_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dtrack -d dtrack]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [dtrack_private]

  dependency-track-api:
    <<: *hardened
    profiles: [dependency-track]
    build:
      context: .
      dockerfile: security-assurance/dependency-track/apiserver/Dockerfile
      args:
        DEPENDENCY_TRACK_VERSION: ${DEPENDENCY_TRACK_VERSION:-latest}
    image: sat-sa/dependency-track-api:${DEPENDENCY_TRACK_VERSION:-latest}
    restart: unless-stopped
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://dependency-track-db:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: ${DTRACK_DB_PASSWORD:?Set DTRACK_DB_PASSWORD in .env}
      ALPINE_DATABASE_POOL_ENABLED: "true"
      ALPINE_DATABASE_POOL_MAX_SIZE: "20"
      ALPINE_CORS_ENABLED: "true"
      ALPINE_CORS_ALLOW_ORIGIN: http://127.0.0.1:${DTRACK_FRONTEND_PORT:-8080}
      ALPINE_METRICS_ENABLED: "false"
    volumes:
      - dtrack_data:/data
    depends_on:
      dependency-track-db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${DTRACK_API_PORT:-8081}:8080
    networks: [dtrack_private, feed_egress]

  dependency-track-frontend:
    <<: *hardened
    profiles: [dependency-track]
    build:
      context: .
      dockerfile: security-assurance/dependency-track/frontend/Dockerfile
      args:
        DEPENDENCY_TRACK_VERSION: ${DEPENDENCY_TRACK_VERSION:-latest}
    image: sat-sa/dependency-track-frontend:${DEPENDENCY_TRACK_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://127.0.0.1:${DTRACK_API_PORT:-8081}
    depends_on:
      - dependency-track-api
    ports:
      - 127.0.0.1:${DTRACK_FRONTEND_PORT:-8080}:8080
    networks: [dtrack_private]

  elasticsearch:
    <<: *hardened
    profiles: [elk]
    build:
      context: .
      dockerfile: soc-evidence/elk/elasticsearch/Dockerfile
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION:-latest}
    image: sat-sa/elasticsearch:${ELASTIC_VERSION:-latest}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [elk_private]

  elk-bootstrap:
    <<: *hardened
    profiles: [elk]
    build:
      context: .
      dockerfile: soc-evidence/elk/setup/Dockerfile
      args:
        CURL_VERSION: ${CURL_VERSION:-8.12.1}
    image: sat-sa/elk-bootstrap:${CURL_VERSION:-8.12.1}
    entrypoint: [/bin/sh, /bootstrap.sh]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set LOGSTASH_PASSWORD in .env}
    volumes:
      - ./soc-evidence/elk/setup/bootstrap.sh:/bootstrap.sh:ro
    depends_on: [elasticsearch]
    networks: [elk_private]
    restart: "no"

  kibana:
    <<: *hardened
    profiles: [elk]
    build:
      context: .
      dockerfile: soc-evidence/elk/kibana/Dockerfile
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION:-latest}
    image: sat-sa/kibana:${ELASTIC_VERSION:-latest}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?Set KIBANA_SYSTEM_PASSWORD in .env}
    depends_on:
      elk-bootstrap:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${KIBANA_PORT:-5601}:5601
    networks: [elk_private]

  logstash:
    <<: *hardened
    profiles: [elk]
    build:
      context: .
      dockerfile: soc-evidence/elk/logstash/Dockerfile
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION:-latest}
    image: sat-sa/logstash:${ELASTIC_VERSION:-latest}
    restart: unless-stopped
    environment:
      LOGSTASH_USERNAME: logstash_internal
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set LOGSTASH_PASSWORD in .env}
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./soc-evidence/elk/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elk-bootstrap:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${LOGSTASH_PORT:-5044}:5044
    networks: [elk_private]

  wazuh-manager:
    <<: *hardened
    profiles: [wazuh]
    build:
      context: .
      dockerfile: soc-evidence/wazuh/manager/Dockerfile
      args:
        WAZUH_VERSION: ${WAZUH_VERSION:-4.14.8}
    image: sat-sa/wazuh-manager:${WAZUH_VERSION:-4.14.8}
    restart: unless-stopped
    environment:
      API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in .env}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
    ports:
      - 127.0.0.1:${WAZUH_REGISTRATION_PORT:-1515}:1515
      - 127.0.0.1:${WAZUH_AGENT_PORT:-1514}:1514
      - 127.0.0.1:${WAZUH_SYSLOG_PORT:-514}:514/udp
      - 127.0.0.1:${WAZUH_API_PORT:-55000}:55000
    networks: [wazuh_private]

volumes:
  grype_db_cache:
  dtrack_db:
  dtrack_data:
  elasticsearch_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:

networks:
  scan_internal:
    internal: true
  scanner_egress:
  dtrack_private:
    internal: true
  feed_egress:
  elk_private:
    internal: true
  wazuh_private:
    internal: true